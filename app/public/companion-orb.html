<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大肥鱼</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; user-select: none; font-family: system-ui, sans-serif; }
    .stage { position: absolute; inset: 0; touch-action: none; cursor: grab; outline: none; }
    .stage:active { cursor: grabbing; }
    .stage:focus-visible { outline: 2px solid #66b8ff; outline-offset: -3px; }
    .character { position: absolute; inset: 0; transform: scale(var(--pet-scale, 1)); transition: transform .16s ease; pointer-events: none; }
    .stage:hover .character { transform: scale(calc(var(--pet-scale, 1) * 1.035)); }
    .stage:active .character { transform: scale(calc(var(--pet-scale, 1) * .98)); }
    video { position: absolute; width: 429px; height: 241px; max-width: none; left: 50%; top: -32px; transform: translateX(-50%); object-fit: fill; pointer-events: none; opacity: 0; }
    video.visible { opacity: 1; }
    .label { position: absolute; left: 16px; right: 16px; bottom: 1px; height: 20px; display: grid; place-items: center; border-radius: 8px; background: #14243dc9; color: #f7fbff; font-size: 11px; font-weight: 600; pointer-events: none; white-space: nowrap; }
    .busy .label { background: #16649bdc; }
    @media (prefers-reduced-motion: reduce) { .character { transition: none; } }
  </style>
</head>
<body data-palette="original">
  <div class="stage" id="stage" role="button" tabindex="0" aria-label="打开大肥鱼快捷面板">
    <div class="character" aria-hidden="true">
      <video id="clip-a" muted playsinline preload="auto" class="visible"></video>
      <video id="clip-b" muted playsinline preload="auto"></video>
    </div>
    <div class="label" id="label">大肥鱼</div>
  </div>
  <script src="./companion-orb.js"></script>
</body>
</html>
